name: stoplightio/elements/test-and-release
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    container:
      image: node:lts
    steps:
    - uses: actions/checkout@v4.1.0
    - run: npm ci
    - run: npm run type-check
    - run: npm run lint
    - run: npm run test.prod
    - uses: actions/upload-artifact@v4.1.0
      with:
        name: test-results
        path: test-results
  build:
    runs-on: ubuntu-latest
    container:
      image: node:lts
    steps:
    - uses: actions/checkout@v4.1.0
    - run: npm ci
    - run: npm run build
    - name: Install the built packages like an app does, with the overrides the migration guide asks for
      run: npm run test.consumer
    - name: Same without the overrides (fails until Mosaic and the viewers are released with fixes)
      run: npm run test.consumer -- --plain
      continue-on-error: true
    - uses: actions/upload-artifact@v4.1.0
      with:
        name: build-output
        path: |
          demo/package.json
          packages/elements/dist/
          packages/elements/package.json
          packages/elements-core/dist/
          packages/elements-core/package.json
          packages/elements-dev-portal/dist/
          packages/elements-dev-portal/package.json
          examples/
          examples-dev/
          e2e/
          playwright.config.ts
          tsconfig.json
          use-local-elements.sh
          package.json
          package-lock.json
          lerna.json
  build-docs:
    runs-on: ubuntu-latest
    container:
      image: node:lts
    steps:
    - uses: actions/checkout@v4.1.0
    - run: npm ci
    - run: npm run build.docs
  e2e-react-vite:
    runs-on: ubuntu-latest
    container:
      image: node:24
      env:
        TERM: xterm
    needs:
    - build
    env:
      example-name: react-vite
    steps:
    - uses: actions/download-artifact@v4.1.3
      with:
        name: build-output
        path: ./
    - name: Install root dependencies
      run: npm ci
    - name: Example - use local builds
      run: npm run copy:${{ env.example-name }}
    - name: Example - Install dependencies
      run: npm install
      working-directory: ./examples-dev/${{ env.example-name }}
    - name: Example - Build
      run: npm run build
      working-directory: ./examples-dev/${{ env.example-name }}
    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium firefox webkit
    - name: Run E2E checks
      run: npm run e2e:run:${{ env.example-name }}
    - uses: actions/upload-artifact@v4.1.0
      if: always()
      with:
        name: e2e-react-vite-results
        path: e2e-results
  e2e-angular:
    runs-on: ubuntu-latest
    container:
      image: node:24
      env:
        TERM: xterm
    needs:
    - build
    env:
      example-name: angular
    steps:
    - uses: actions/download-artifact@v4.1.3
      with:
        name: build-output
        path: ./
    - name: Install root dependencies
      run: npm ci
    - name: Example - use local builds
      run: npm run copy:${{ env.example-name }}
    - name: Example - Install dependencies
      run: npm install
      working-directory: ./examples-dev/${{ env.example-name }}
    - name: Example - Build
      run: npm run build
      working-directory: ./examples-dev/${{ env.example-name }}
    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium firefox webkit
    - name: Run E2E checks
      run: npm run e2e:run:${{ env.example-name }}
    - uses: actions/upload-artifact@v4.1.0
      if: always()
      with:
        name: e2e-angular-results
        path: e2e-results
  e2e-static-html:
    runs-on: ubuntu-latest
    container:
      image: node:24
      env:
        TERM: xterm
    needs:
    - build
    env:
      example-name: static-html
    steps:
    - uses: actions/download-artifact@v4.1.3
      with:
        name: build-output
        path: ./
    - name: Install root dependencies
      run: npm ci
    - name: Example - use local builds
      run: npm run copy:${{ env.example-name }}
    - name: Example - Install dependencies
      run: npm install
      working-directory: ./examples-dev/${{ env.example-name }}
    - name: Example - Build
      run: npm run build
      working-directory: ./examples-dev/${{ env.example-name }}
    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium firefox webkit
    - name: Run E2E checks
      run: npm run e2e:run:${{ env.example-name }}
    - uses: actions/upload-artifact@v4.1.0
      if: always()
      with:
        name: e2e-static-html-results
        path: e2e-results
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: node:lts
    needs:
    - lint-and-check
    - build
    - build-docs
    - e2e-react-vite
    - e2e-static-html
    - e2e-angular
    steps:
    - uses: actions/checkout@v4.1.0
    - name: Configure Git safe directory
      run: git config --global --add safe.directory /__w/elements/elements
    - name: Install Dependencies
      run: npm ci
    - name: Set NPM Token
      run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
    - name: Run Release Script
      run: npm run release
