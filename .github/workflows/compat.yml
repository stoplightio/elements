name: stoplightio/elements/compat
# Checks that the code in the branch behaves and looks the same as a published version of Elements, by running the
# same end-to-end tests against both and comparing screenshots. See "Compare a build with a published version" in
# CONTRIBUTING.md. Run it by hand, for example before a major release.
on:
  workflow_dispatch:
    inputs:
      elements-version:
        description: Published version of @stoplight/elements to compare with (empty is the newest 9.x)
        default: ''
      dev-portal-version:
        description: Published version of @stoplight/elements-dev-portal to compare with (empty is the newest 3.x)
        default: ''

jobs:
  compat:
    runs-on: ubuntu-latest
    container:
      image: node:24
      env:
        TERM: xterm
    strategy:
      fail-fast: false
      matrix:
        example:
        - react-vite
        - angular
        - static-html
        react:
        - '19'
        include:
        # Elements 9 was made for React 18, so the behavior check also runs the way it was meant to be used
        - example: react-vite
          react: '18'
    steps:
    - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
    - run: npm ci
    - run: npm run build
    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium
    - name: Behavior - same tests against the published version (React ${{ matrix.react }})
      run: npm run e2e:baseline -- ${{ matrix.example }} '${{ inputs.elements-version }}' '${{ inputs.dev-portal-version }}' --project=chromium
      env:
        REACT: ${{ matrix.react }}
    - name: Appearance - screenshots against the published version
      if: matrix.react == '19'
      run: npm run e2e:visual-compat -- ${{ matrix.example }} '${{ inputs.elements-version }}' '${{ inputs.dev-portal-version }}'
    - uses: actions/upload-artifact@1eb3cb2b3e0f29609092a73eb033bb759a334595 # v4.1.0
      if: always()
      with:
        name: compat-${{ matrix.example }}-react-${{ matrix.react }}-results
        path: e2e-results
